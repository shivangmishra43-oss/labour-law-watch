<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Labour Law Watch</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <div class="brand-mark">
                    ⚖
                </div>

                <div>
                    <h1>Labour Law Watch</h1>

                    <p>
                        Labour law updates
                    </p>
                </div>

            </div>

        </div>

    </header>


    <!-- ========================================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================================= -->

    <main class="container">

        <!-- PAGE INTRO -->

        <section class="page-intro">

            <h2>
                Latest Labour Law Updates
            </h2>

            <p>
                Track labour law notifications, amendments,
                circulars and other legal developments.
            </p>

        </section>


        <!-- ===================================== -->
        <!-- STATISTICS -->
        <!-- ===================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <span class="stat-label">
                    Total Updates
                </span>

                <strong
                    id="totalUpdates"
                    class="stat-value"
                >
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Karnataka
                </span>

                <strong
                    id="karnatakaUpdates"
                    class="stat-value"
                >
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Central
                </span>

                <strong
                    id="centralUpdates"
                    class="stat-value"
                >
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Latest
                </span>

                <strong
                    id="latestDate"
                    class="stat-value stat-date"
                >
                    —
                </strong>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- FILTERS -->
        <!-- ===================================== -->

        <section class="filters-card">

            <div class="filter-group search-group">

                <label for="searchInput">
                    Search
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search labour law updates..."
                >

            </div>


            <div class="filter-group">

                <label for="jurisdictionFilter">
                    Jurisdiction
                </label>

                <select id="jurisdictionFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="Central">
                        Central
                    </option>

                    <option value="Karnataka">
                        Karnataka
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="typeFilter">
                    Update Type
                </label>

                <select id="typeFilter">

                    <option value="all">
                        All
                    </option>

                </select>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- RESULTS HEADER -->
        <!-- ===================================== -->

        <section class="results-header">

            <div>

                <h3>
                    Updates
                </h3>

                <span
                    id="resultsCount"
                    class="results-count"
                >
                    0 updates
                </span>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- UPDATE CARDS -->
        <!-- ===================================== -->

        <section
            id="updatesContainer"
            class="updates-grid"
        >

            <div class="loading-state">

                <div class="loading-spinner"></div>

                <p>
                    Loading updates...
                </p>

            </div>

        </section>

    </main>


    <!-- ========================================= -->
    <!-- DETAIL MODAL -->
    <!-- ========================================= -->

    <div
        id="detailModal"
        class="modal hidden"
    >

        <div class="modal-overlay"></div>


        <div class="modal-content">

            <button
                id="closeModal"
                class="modal-close"
                aria-label="Close"
            >
                ×
            </button>


            <div
                id="modalBody"
                class="modal-body"
            >
            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="app.js"></script>

</body>
</html>
