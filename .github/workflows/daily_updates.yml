name: Daily Central Labour Law Updates

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-central-labour-law-data:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. INSTALL PLAYWRIGHT
      # ============================================

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium


      # ============================================
      # 5. PRESERVE KARNATAKA WEBSITE DATA
      # ============================================

      - name: Preserve Karnataka website records
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("data/updates.json")

          if path.exists():
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              karnataka = [
                  update
                  for update in data.get("updates", [])
                  if update.get("jurisdiction") == "Karnataka"
              ]

          else:
              karnataka = []

          Path("karnataka_updates_backup.json").write_text(
              json.dumps(
                  {
                      "updates": karnataka
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Preserved Karnataka records: {len(karnataka)}"
          )


      # ============================================
      # 6. COLLECT CENTRAL E-GAZETTE
      # ============================================

      - name: Collect Central eGazette updates
        run: |
          python collectors/egazette.py


      # ============================================
      # 7. EXTRACT CENTRAL GAZETTE INFORMATION
      # ============================================

      - name: Extract Central Gazette information
        run: |
          python extractors/legal_extractor.py


      # ============================================
      # 8. EXPORT CENTRAL WEBSITE DATA
      # ============================================

      - name: Export Central website data
        run: |
          python export_updates.py


      # ============================================
      # 9. MERGE KARNATAKA BACK
      # ============================================

      - name: Restore Karnataka website records
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("data/updates.json")
          backup_path = Path(
              "karnataka_updates_backup.json"
          )

          current = json.loads(
              path.read_text(encoding="utf-8")
          )

          backup = json.loads(
              backup_path.read_text(encoding="utf-8")
          )

          central = [
              update
              for update in current.get("updates", [])
              if update.get("jurisdiction") != "Karnataka"
          ]

          karnataka = backup.get(
              "updates",
              []
          )

          merged = central + karnataka

          merged.sort(
              key=lambda update:
                  update.get("publication_date") or "",
              reverse=True
          )

          path.write_text(
              json.dumps(
                  {
                      "count": len(merged),
                      "updates": merged
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Central records: {len(central)}"
          )

          print(
              f"Karnataka records restored: {len(karnataka)}"
          )

          print(
              f"Total website records: {len(merged)}"
          )


      # ============================================
      # 10. REMOVE TEMPORARY FILE
      # ============================================

      - name: Remove temporary Karnataka backup
        run: |
          rm -f karnataka_updates_backup.json


      # ============================================
      # 11. COMMIT WEBSITE DATA
      # ============================================

      - name: Commit updated website data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/updates.json

          if git diff --cached --quiet; then
            echo "No website data changes detected."
          else
            git commit -m "Update central labour law data"
            git push
          fi