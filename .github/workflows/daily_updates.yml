name: Daily Labour Law Updates

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update-labour-law-data:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. INSTALL PLAYWRIGHT
      # ============================================

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium


      # ============================================
      # 5. DIAGNOSTIC - KARNATAKA CONNECTIVITY
      # ============================================

      - name: Test Karnataka e-Gazette connectivity
        run: |

          echo "========================================"
          echo "KARNATAKA E-GAZETTE NETWORK TEST"
          echo "========================================"

          echo ""
          echo "Testing DNS..."
          getent hosts erajyapatra.karnataka.gov.in || true

          echo ""
          echo "Testing HTTPS connection..."
          curl \
            --verbose \
            --location \
            --connect-timeout 30 \
            --max-time 90 \
            --output /tmp/karnataka_response.html \
            --write-out "\nHTTP_STATUS=%{http_code}\nTOTAL_TIME=%{time_total}\n" \
            "https://erajyapatra.karnataka.gov.in/"

          echo ""
          echo "Response file information:"
          ls -lh /tmp/karnataka_response.html || true

          echo ""
          echo "First 500 characters of response:"
          head -c 500 /tmp/karnataka_response.html || true

          echo ""
          echo ""
          echo "========================================"
          echo "NETWORK TEST COMPLETE"
          echo "========================================"


      # ============================================
      # 6. COLLECT CENTRAL EGAZETTE
      # ============================================

      - name: Collect Central eGazette updates
        run: |
          python collectors/egazette.py


      # ============================================
      # 7. EXTRACT CENTRAL GAZETTE INFORMATION
      # ============================================

      - name: Extract Central Gazette information
        run: |
          python extractors/legal_extractor.py


      # ============================================
      # 8. COLLECT KARNATAKA E-GAZETTE
      # ============================================

      - name: Collect Karnataka e-Gazette updates
        run: |
          python collectors/karnataka.py


      # ============================================
      # 9. EXTRACT KARNATAKA GAZETTE INFORMATION
      # ============================================

      - name: Extract Karnataka Gazette information
        run: |
          python extractors/karnataka_extractor.py


      # ============================================
      # 10. IMPORT KARNATAKA DATA
      # ============================================

      - name: Import Karnataka updates
        run: |
          python database/import_karnataka.py


      # ============================================
      # 11. EXPORT WEBSITE DATA
      # ============================================

      - name: Export updates JSON
        run: |
          python export_updates.py


      # ============================================
      # 12. COMMIT UPDATED WEBSITE DATA
      # ============================================

      - name: Commit updated website data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/updates.json

          if git diff --cached --quiet; then
            echo "No website data changes detected."
          else
            git commit -m "Update labour law data"
            git push
          fi