name: Daily Central Labour Law Updates

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update-central-labour-law-data:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. INSTALL PLAYWRIGHT
      # ============================================

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium


      # ============================================
      # 5. COLLECT CENTRAL E-GAZETTE
      # ============================================

      - name: Collect Central eGazette updates
        run: |
          python collectors/egazette.py


      # ============================================
      # 6. EXTRACT CENTRAL GAZETTE INFORMATION
      # ============================================

      - name: Extract Central Gazette information
        run: |
          python extractors/legal_extractor.py


      # ============================================
      # 7. EXPORT WEBSITE DATA
      # ============================================

      - name: Export updates JSON
        run: |
          python export_updates.py


      # ============================================
      # 8. COMMIT UPDATED WEBSITE DATA
      # ============================================

      - name: Commit updated website data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/updates.json

          if git diff --cached --quiet; then
            echo "No website data changes detected."
          else
            git commit -m "Update central labour law data"
            git push
          fi